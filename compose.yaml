name: twitter-clone

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: twitter_clone
      POSTGRES_USER: twitter
      POSTGRES_PASSWORD: twitter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter -d twitter_clone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://twitter:twitter@database:5432/twitter_clone
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production}
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:${DOCKER_PORT:-8080}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-X Clone <onboarding@resend.dev>}"
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-X Clone}
    ports:
      - "${DOCKER_PORT:-8080}:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
